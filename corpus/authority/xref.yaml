# Pub → underlying authority cross-reference.
# This is the source of truth that joins each IRS Publication citation to the
# IRC sections, Treasury Regs, Revenue Rulings/Procs, and key case law it
# summarizes. Curated by hand; expand as new Pubs are added to the corpus.
#
# Keys are normalized to "pub_<digits>". The Pub itself can be cited as
# "Pub 17", "Publication 17", or "17" — app/authority.py normalizes.


[project]
name = "tintin"
version = "0.1.0"
description = "Local-sourced tax research coach for CPA-firm admin staff (internal codename)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=5.0.0",
    "unstructured>=0.15.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "authlib>=1.3.0",
    "textstat>=0.7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "black>=24.0.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
